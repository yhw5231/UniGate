services:
  unigate:
    # 容器部署 = 本地重编译：克隆仓库后在仓库目录执行 docker compose up -d --build
    # （更新版本：git pull 后再次执行 docker compose up -d --build）
    build:
      context: .
      dockerfile: Dockerfile
      # 版本号默认自动从 .git 推导（tag 或短提交哈希）；需要固定时取消注释：
      # args:
      #   VERSION: v1.0.0
    container_name: unigate
    restart: unless-stopped
    ports:
      - "10010:10010"   # 网关（/v1/*）与 WebUI/Admin 同端口
    environment:
      PORT: "10010"
      DATA_DIR: /data
      # 如需把 WebUI/Admin 拆到独立端口（便于只暴露网关），取消注释：
      # WEBUI_PORT: "10070"   # 同时在 ports 里加 - "10070:10070"
      # 数据目录属主（启动时自动 chown /data 后以此身份运行；默认取镜像内 app
      # 用户的 uid/gid，通常 100:100——与宿主机目录属主无关，bind mount 任意属主均可）
      # PUID: 1000
      # PGID: 1000
      # WebUI 管理员（默认 admin/admin，务必修改）
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: admin
      # 下游是否强制通用 key（默认 true）
      # GW_KEY_AUTH: "true"
      # 故障转移：仅 429 记冷却；网络错误/连续 5xx 超阈值自动换出口 IP
      # RATE_LIMIT_COOLDOWN: 1h
      # ROTATE_AFTER_5XX: 3
    volumes:
      - ./data:/data
